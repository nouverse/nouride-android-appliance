[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.85"

[workspace.dependencies]
shared = { path = "crates/shared" }
place = { path = "crates/place" }
daemon = { path = "crates/daemon" }
service = { path = "crates/service" }
updates = { path = "crates/updates" }
link-policy = { path = "crates/link-policy" }
downloads = { path = "crates/downloads" }
backup = { path = "crates/backup" }
looks = { path = "crates/looks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
getrandom = "0.3"
